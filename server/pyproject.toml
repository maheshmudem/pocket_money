[project]
name = "pocket-cfo-server"
version = "1.0.0"
description = "Pocket CFO Enterprise Django REST Framework Backend (Identity, Multi-Profile RBAC, Idempotent Sync & Audit)"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<6.1",
  "djangorestframework>=3.15.2",
  "djangorestframework-simplejwt>=5.5.0",
  "drf-spectacular>=0.28.0",
  "argon2-cffi>=23.1.0",
  "django-cors-headers>=4.6.0",
  "gunicorn>=23.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-django>=4.9.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "common*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
