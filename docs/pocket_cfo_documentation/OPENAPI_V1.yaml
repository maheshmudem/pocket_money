openapi: 3.1.0
info:
  title: Pocket CFO API
  version: 1.0.0
  description: >-
    Canonical v1 REST API contract for Pocket CFO identity, multi-profile RBAC,
    device/session management, and idempotent local-first ledger synchronization.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api-staging.pocketcfo.app/api/v1
    description: Staging environment
  - url: https://api.pocketcfo.app/api/v1
    description: Production environment
security:
  - bearerAuth: []
paths:
  /health/live/:
    get:
      summary: Liveness probe
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Service alive
  /health/ready/:
    get:
      summary: Readiness probe (database connectivity)
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Service ready
        '503':
          description: Dependency unavailable
  /auth/register/:
    post:
      summary: Register a new user account
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRegisterRequest' }
      responses:
        '201':
          description: User registered and session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login/:
    post:
      summary: Authenticate with email and password
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthLoginRequest' }
      responses:
        '200':
          description: Authenticated session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh/:
    post:
      summary: Rotate refresh token and issue new access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRefreshRequest' }
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout/:
    post:
      summary: Revoke current refresh session
      operationId: logoutUser
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRefreshRequest' }
      responses:
        '200':
          description: Session revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password-reset/:
    post:
      summary: Request password recovery token
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Uniform safe recovery acknowledgement
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me/:
    get:
      summary: Retrieve authenticated user summary
      operationId: getCurrentUser
      responses:
        '200':
          description: Authenticated user details
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profiles/:
    get:
      summary: List profiles accessible to the authenticated account
      operationId: listProfiles
      responses:
        '200':
          description: Accessible profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a financial profile
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileCreate' }
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profiles/{profile_id}/:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      summary: Retrieve profile details
      operationId: getProfile
      responses:
        '200':
          description: Profile details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update permitted profile metadata
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Archive profile (Owner only with explicit confirmation)
      operationId: archiveProfile
      responses:
        '200': { description: Profile archived }
        '403': { $ref: '#/components/responses/Forbidden' }
  /profiles/{profile_id}/members/:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      summary: List profile members if caller has permission
      operationId: listProfileMembers
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Invite or add a member to the profile (Owner/Admin)
      operationId: addProfileMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberInviteRequest' }
      responses:
        '201': { description: Member invited/added }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /profiles/{profile_id}/members/{member_id}/:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - in: path
        name: member_id
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Update member role or editor posting policy
      operationId: updateProfileMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberPatchRequest' }
      responses:
        '200': { description: Membership updated }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Revoke a profile member
      operationId: removeProfileMember
      responses:
        '204': { description: Membership revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices/:
    get:
      summary: List registered devices for authenticated user
      operationId: listDevices
      responses:
        '200':
          description: Registered devices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Register this app installation as a device
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '201': { description: Device registered }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /devices/{device_id}/:
    delete:
      summary: Revoke a registered device and all its active sessions
      operationId: revokeDevice
      parameters:
        - in: path
          name: device_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Device revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sync/push/:
    post:
      summary: Submit an idempotent batch of local outbox operations
      operationId: pushSyncOperations
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200':
          description: Per-operation outcomes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sync/pull/:
    get:
      summary: Pull incremental changes after an opaque monotonic cursor
      operationId: pullSyncChanges
      parameters:
        - in: query
          name: profile_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          required: false
          schema: { type: string, maxLength: 2048 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Incremental changes and next cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sync/status/:
    get:
      summary: Retrieve latest server sync sequence and device sync health
      operationId: getSyncStatus
      parameters:
        - in: query
          name: profile_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Sync status metadata }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProfileId:
      in: path
      name: profile_id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    MetaEnvelope:
      type: object
      properties:
        request_id: { type: string }
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            field_errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
        meta: { $ref: '#/components/schemas/MetaEnvelope' }
    AuthRegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        device_id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios, windows, web] }
        app_version: { type: string, maxLength: 32 }
        device_label: { type: string, maxLength: 80 }
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device_id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios, windows, web] }
        app_version: { type: string, maxLength: 32 }
        device_label: { type: string, maxLength: 80 }
    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    AuthSessionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [access_token, refresh_token, expires_in_seconds, user]
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            expires_in_seconds: { type: integer }
            user:
              type: object
              required: [id, email, display_name]
              properties:
                id: { type: string, format: uuid }
                email: { type: string, format: email }
                display_name: { type: string }
        meta: { $ref: '#/components/schemas/MetaEnvelope' }
    ProfileCreate:
      type: object
      required: [name, profile_type, base_currency_code]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        profile_type: { type: string, enum: [personal, family, business] }
        base_currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        timezone: { type: string, maxLength: 64, default: 'Asia/Kolkata' }
        editors_can_post: { type: boolean, default: true }
    ProfilePatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        timezone: { type: string, maxLength: 64 }
        base_currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        editors_can_post: { type: boolean }
        expected_version: { type: integer, minimum: 1 }
    Profile:
      allOf:
        - $ref: '#/components/schemas/ProfileCreate'
        - type: object
          required: [id, role, version]
          properties:
            id: { type: string, format: uuid }
            role: { type: string, enum: [owner, admin, editor, viewer] }
            version: { type: integer, minimum: 1 }
            archived_at_utc: { type: string, format: date-time, nullable: true }
    ProfileResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Profile' }
        meta: { $ref: '#/components/schemas/MetaEnvelope' }
    ProfileListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Profile' } }
        meta: { $ref: '#/components/schemas/MetaEnvelope' }
    MemberInviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, editor, viewer] }
    MemberPatchRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [owner, admin, editor, viewer] }
        confirm_password: { type: string }
    Member:
      type: object
      required: [id, profile_id, user_id, email, display_name, role, membership_status]
      properties:
        id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [owner, admin, editor, viewer] }
        membership_status: { type: string, enum: [active, invited, revoked] }
    MemberListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Member' } }
        meta: { $ref: '#/components/schemas/MetaEnvelope' }
    DeviceRegistration:
      type: object
      required: [device_id, platform, app_version]
      properties:
        device_id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios, windows, web] }
        app_version: { type: string, maxLength: 32 }
        device_label: { type: string, maxLength: 80 }
    DeviceListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/DeviceRegistration'
              - type: object
                properties:
                  last_seen_at_utc: { type: string, format: date-time }
                  revoked_at_utc: { type: string, format: date-time, nullable: true }
        meta: { $ref: '#/components/schemas/MetaEnvelope' }
    SyncOperation:
      type: object
      required: [operation_id, profile_id, entity_type, entity_id, operation_type, payload_version, payload]
      properties:
        operation_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        entity_type: { type: string, maxLength: 64 }
        entity_id: { type: string, format: uuid }
        operation_type: { type: string, enum: [create, update, archive, delete] }
        payload_version: { type: integer, minimum: 1 }
        base_version: { type: integer, nullable: true }
        payload: { type: object, additionalProperties: true }
    SyncPushRequest:
      type: object
      required: [device_id, operations]
      properties:
        device_id: { type: string, format: uuid }
        operations: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/SyncOperation' } }
    SyncOperationResult:
      type: object
      required: [operation_id, outcome]
      properties:
        operation_id: { type: string, format: uuid }
        outcome: { type: string, enum: [accepted, duplicate, retryable_error, permanent_error, conflict] }
        server_version: { type: integer, nullable: true }
        error_code: { type: string, nullable: true }
        server_payload: { type: object, nullable: true, additionalProperties: true }
    SyncPushResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [results]
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/SyncOperationResult' } }
        meta: { $ref: '#/components/schemas/MetaEnvelope' }
    SyncPullResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [changes, next_cursor, has_more]
          properties:
            changes: { type: array, items: { type: object, additionalProperties: true } }
            next_cursor: { type: string }
            has_more: { type: boolean }
        meta: { $ref: '#/components/schemas/MetaEnvelope' }
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Version or state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
