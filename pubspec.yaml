name: pocket_money
description: "Pocket CFO — Local-first personal, household, and business financial management platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  go_router: ^17.5.0
  get_it: ^9.3.0
  drift: ">=2.33.0 <2.34.6"
  sqlite3: ^3.5.2
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  cryptography: ^2.9.0
  dio: ^5.11.1
  intl: ^0.20.3
  uuid: ^4.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  fl_chart: ^1.3.1
  csv: ^8.0.0
  pdf: ^3.13.1
  printing: ^5.15.1
  file_picker: ^13.4.0
  share_plus: ^13.3.1
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ">=2.33.0 <2.34.6"
  build_runner: ^2.4.15
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

dependency_overrides:
  # path_provider_android 2.3.x (package:jni 1.2.0) crashes on Android with
  # ClassNotFoundException("Landroid/content/Context;"); pin stable 2.2.x Pigeon impl.
  path_provider_android: ">=2.2.0 <2.3.0"

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding/
